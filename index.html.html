<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardião da Floresta — Desafios de Padrões</title>
<style>
/* Forest theme with high contrast */
:root {
  --forest-900: #1a3d1a;
  --forest-800: #234a24;
  --forest-700: #2d5016;
  --forest-600: #3d6b1f;
  --leaf-500: #7fb069;
  --leaf-300: #b8d4a8;
  --leaf-100: #e5f0da;
  --cream-50:  #fffdf5;
  --cream-100: #fdf8e8;
  --cream-200: #f5ecd0;
  --bark-800:  #3d2412;
  --bark-700:  #6b4423;
  --bark-600:  #8b5a2b;
  --bark-500:  #a67c52;
  --sun-500:   #f9c74f;
  --sun-700:   #b8860b;
  --berry-500: #e76f51;
  --berry-600: #c94e30;
  --sky-500:   #577590;
  --white:     #ffffff;
  --text:      #1a3d1a;
  --text-muted:#3d5c33;
  --line:      #d8c8a0;
  --line-dark: #b8a370;
  --radius: 20px;
  --radius-sm: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--cream-100);
  background-image: 
    radial-gradient(circle at 8% 8%, rgba(127,176,105,.22) 0%, transparent 30%),
    radial-gradient(circle at 92% 15%, rgba(249,199,79,.18) 0%, transparent 30%),
    radial-gradient(circle at 25% 92%, rgba(139,90,43,.14) 0%, transparent 35%),
    radial-gradient(circle at 85% 85%, rgba(127,176,105,.16) 0%, transparent 35%);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  padding: 16px 12px 48px;
  -webkit-tap-highlight-color: transparent;
  line-height: 1.5;
}

.app {
  max-width: 780px;
  margin: 0 auto;
}

/* ============================================================
   HEADER
   ============================================================ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: linear-gradient(135deg, var(--forest-700) 0%, var(--forest-600) 100%);
  color: var(--cream-50);
  border-radius: var(--radius);
  padding: 16px 22px;
  box-shadow: 
    0 6px 0 var(--forest-900),
    0 14px 30px rgba(26, 61, 26, .25);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-emoji {
  font-size: 2.2rem;
  line-height: 1;
  background: rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 6px 10px;
  animation: sway 3.5s ease-in-out infinite;
}
@keyframes sway {
  0%, 100% { transform: rotate(-3deg); }
  50%      { transform: rotate(3deg); }
}
.brand h1 {
  font-size: 1.3rem;
  margin: 0;
  letter-spacing: -.3px;
  color: var(--cream-50);
  font-weight: 900;
}
.brand p {
  margin: 2px 0 0;
  font-size: .78rem;
  color: var(--leaf-300);
  font-weight: 600;
}
.score {
  background: var(--sun-500);
  color: var(--bark-800);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 900;
  font-size: 1rem;
  white-space: nowrap;
  box-shadow: 0 3px 0 var(--sun-700);
}

/* ============================================================
   PROGRESS
   ============================================================ */
.progress {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 16px 0 18px;
}
.dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--line-dark);
  background: var(--cream-100);
  color: var(--bark-700);
  font-weight: 800;
  font-size: .82rem;
  cursor: pointer;
  transition: all .18s;
  font-family: inherit;
  box-shadow: 0 2px 0 var(--line-dark);
}
.dot:hover:not(.locked) {
  transform: translateY(-2px);
  box-shadow: 0 4px 0 var(--line-dark);
}
.dot.done {
  background: var(--forest-600);
  border-color: var(--forest-700);
  color: var(--white);
  box-shadow: 0 2px 0 var(--forest-800);
}
.dot.current {
  background: var(--sun-500);
  border-color: var(--sun-700);
  color: var(--bark-800);
  transform: scale(1.15);
  box-shadow: 0 0 0 4px rgba(249,199,79,.35);
}
.dot.locked {
  opacity: .4;
  cursor: not-allowed;
}

/* ============================================================
   LEVEL CARD
   ============================================================ */
.level {
  background: var(--cream-50);
  border-radius: var(--radius);
  padding: 26px 22px 28px;
  border: 3px solid var(--bark-600);
  box-shadow: 
    0 5px 0 var(--bark-700),
    0 12px 30px rgba(61, 36, 18, .15);
  animation: fadeUp .35s ease;
  position: relative;
}
.level::before, .level::after {
  content: '🌿';
  position: absolute;
  font-size: 1.4rem;
  opacity: .5;
}
.level::before { top: 8px; left: 12px; }
.level::after  { bottom: 8px; right: 12px; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.level-head { text-align: center; margin-bottom: 22px; }
.badge {
  display: inline-block;
  color: var(--white);
  font-weight: 900;
  font-size: .72rem;
  letter-spacing: .8px;
  padding: 6px 16px;
  border-radius: 999px;
  text-transform: uppercase;
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.badge.easy   { background: linear-gradient(135deg, #2d5016, #4a7c2e); }
.badge.medium { background: linear-gradient(135deg, #b8860b, #f9c74f); color: #3d2412; }
.badge.hard   { background: linear-gradient(135deg, #c94e30, #e76f51); }
.badge.final  { background: linear-gradient(135deg, #4a2e7a, #6c5ce7); }

.level-head h2 {
  margin: 14px 0 6px;
  font-size: 1.5rem;
  letter-spacing: -.4px;
  color: var(--forest-900);
  font-weight: 900;
}
.level-head p {
  margin: 0;
  color: var(--text-muted);
  font-size: .95rem;
  line-height: 1.45;
  font-weight: 600;
}

/* ============================================================
   PATTERN AREA
   ============================================================ */
.pattern-area {
  display: flex;
  justify-content: center;
  margin: 8px 0 26px;
  flex-wrap: wrap;
}
.pattern-sequence {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.seq-item {
  min-width: clamp(46px, 11vw, 60px);
  height: clamp(46px, 11vw, 60px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--cream-50);
  border: 2px solid var(--line);
  border-radius: 14px;
  font-size: clamp(22px, 6.5vw, 32px);
  box-shadow: 0 3px 0 var(--line-dark);
  animation: popIn .25s ease;
}
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.seq-item.unknown {
  background: linear-gradient(135deg, #fff8d6, var(--sun-500));
  border: 3px dashed var(--sun-700);
  color: var(--bark-800);
  font-weight: 900;
  font-size: clamp(20px, 5.5vw, 28px);
  animation: glowPulse 1.6s ease-in-out infinite;
  box-shadow: 0 0 0 3px rgba(249,199,79,.25);
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(249,199,79,.25); }
  50%      { box-shadow: 0 0 0 6px rgba(249,199,79,.4); }
}
.seq-item.filled {
  background: linear-gradient(135deg, #d8f5c8, #b8e89a);
  border: 3px solid var(--forest-600);
  animation: fillPop .5s cubic-bezier(.2, 1.5, .5, 1);
  box-shadow: 0 0 20px rgba(74,124,46,.5);
}
@keyframes fillPop {
  0%   { transform: scale(.5); }
  60%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Group items */
.group-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  background: var(--cream-50);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 8px 12px;
  min-height: clamp(46px, 11vw, 60px);
  font-size: clamp(18px, 5vw, 24px);
  box-shadow: 0 3px 0 var(--line-dark);
  animation: popIn .25s ease;
}
.group-item.unknown {
  background: linear-gradient(135deg, #fff8d6, var(--sun-500));
  border: 3px dashed var(--sun-700);
  color: var(--bark-800);
  font-weight: 900;
  font-size: 1.2rem;
  padding: 8px 20px;
  animation: glowPulse 1.6s ease-in-out infinite;
}
.group-item.filled {
  background: linear-gradient(135deg, #d8f5c8, #b8e89a);
  border: 3px solid var(--forest-600);
  animation: fillPop .5s cubic-bezier(.2, 1.5, .5, 1);
  box-shadow: 0 0 20px rgba(74,124,46,.5);
}

/* Grid */
.pattern-grid {
  display: grid;
  gap: 6px;
  background: var(--leaf-100);
  border-radius: 18px;
  padding: 12px;
  border: 2px solid var(--bark-500);
  box-shadow: inset 0 2px 10px rgba(107,68,35,.15);
}
.grid-cell {
  aspect-ratio: 1;
  min-width: 50px;
  min-height: 50px;
  border-radius: 12px;
  background: var(--cream-50);
  border: 2px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(26px, 7.5vw, 38px);
  box-shadow: 0 2px 0 var(--line-dark);
  animation: popIn .2s ease;
}
.grid-cell.unknown {
  background: linear-gradient(135deg, #fff8d6, var(--sun-500));
  border: 3px dashed var(--sun-700);
  color: var(--bark-800);
  font-weight: 900;
  animation: glowPulse 1.6s ease-in-out infinite;
}
.grid-cell.filled {
  background: linear-gradient(135deg, #d8f5c8, #b8e89a);
  border: 3px solid var(--forest-600);
  animation: fillPop .5s cubic-bezier(.2, 1.5, .5, 1);
  box-shadow: 0 0 20px rgba(74,124,46,.5);
}

/* ============================================================
   OPTIONS
   ============================================================ */
.options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 10px;
}
.option-btn {
  border: 2px solid var(--line);
  background: var(--cream-50);
  border-radius: 16px;
  padding: 14px 6px;
  font-family: inherit;
  font-weight: 700;
  font-size: clamp(26px, 7.5vw, 36px);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 64px;
  box-shadow: 0 4px 0 var(--line-dark);
  transition: transform .1s, box-shadow .1s, background .15s, border-color .15s;
  line-height: 1;
}
.option-btn:hover:not(:disabled) {
  background: var(--leaf-100);
  border-color: var(--forest-600);
}
.option-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--line-dark);
}
.option-btn.correct {
  background: linear-gradient(135deg, #d8f5c8, #a8e088);
  border-color: var(--forest-600);
  box-shadow: 0 4px 0 var(--forest-700), 0 0 20px rgba(74,124,46,.4);
  animation: correctPulse .6s ease infinite alternate;
}
@keyframes correctPulse {
  from { box-shadow: 0 4px 0 var(--forest-700), 0 0 15px rgba(74,124,46,.3); }
  to   { box-shadow: 0 4px 0 var(--forest-700), 0 0 30px rgba(74,124,46,.6); }
}
.option-btn.wrong {
  background: linear-gradient(135deg, #ffe5dd, #ffcab8);
  border-color: var(--berry-600);
  box-shadow: 0 4px 0 var(--berry-600);
  animation: shake .45s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.option-btn:disabled { cursor: default; }
.option-btn .option-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0;
  font-size: .55em;
  line-height: 1;
}
.option-btn .option-group span {
  display: inline-block;
}

/* ============================================================
   HINT
   ============================================================ */
.hint {
  margin-top: 22px;
  background: var(--leaf-100);
  border-left: 5px solid var(--forest-600);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: .9rem;
  color: var(--forest-800);
  line-height: 1.45;
  font-weight: 600;
}

/* ============================================================
   TOAST + MODAL
   ============================================================ */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translate(-50%, 140%);
  background: var(--forest-800);
  color: var(--cream-50);
  padding: 13px 22px;
  border-radius: 999px;
  font-weight: 800;
  font-size: .9rem;
  box-shadow: 0 10px 30px rgba(26, 61, 26, .35);
  transition: transform .35s cubic-bezier(.2, 1.4, .5, 1);
  z-index: 200;
  max-width: 90vw;
  text-align: center;
}
.toast.show { transform: translate(-50%, 0); }
.toast.ok    { background: var(--forest-700); }
.toast.warn  { background: var(--sun-700); color: var(--bark-800); }
.toast.error { background: var(--berry-600); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(26, 61, 26, .55);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 300;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--cream-50);
  border: 3px solid var(--bark-600);
  border-radius: 26px;
  padding: 32px 26px;
  text-align: center;
  max-width: 400px;
  width: 100%;
  animation: popIn2 .3s cubic-bezier(.2, 1.4, .5, 1);
  box-shadow: 0 8px 0 var(--bark-700), 0 20px 50px rgba(61, 36, 18, .3);
}
@keyframes popIn2 {
  from { transform: scale(.8); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.modal-emoji {
  font-size: 3.6rem;
  margin-bottom: 8px;
  animation: bounce 1.4s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.modal h3 {
  margin: 0 0 8px;
  font-size: 1.4rem;
  color: var(--forest-900);
  font-weight: 900;
}
.modal p {
  margin: 0 0 22px;
  color: var(--text-muted);
  font-size: .95rem;
  line-height: 1.45;
  font-weight: 600;
}
.btn {
  border: none;
  border-radius: 14px;
  padding: 14px 20px;
  font-family: inherit;
  font-weight: 900;
  font-size: .95rem;
  cursor: pointer;
  background: linear-gradient(135deg, var(--forest-600), var(--forest-500, #4a7c2e));
  color: var(--white);
  box-shadow: 0 4px 0 var(--forest-800);
  transition: transform .1s, box-shadow .1s;
  width: 100%;
  letter-spacing: .3px;
}
.btn:hover { filter: brightness(1.05); }
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--forest-800);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 480px) {
  .level { padding: 20px 14px 22px; }
  .level-head h2 { font-size: 1.25rem; }
  .brand h1 { font-size: 1.1rem; }
  .brand p { display: none; }
  .dot { width: 30px; height: 30px; font-size: .75rem; }
  .options { grid-template-columns: repeat(2, 1fr); }
  .level::before, .level::after { font-size: 1rem; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-emoji">🌳</span>
      <div>
        <h1>Guardião da Floresta</h1>
        <p>10 desafios de reconhecimento de padrões</p>
      </div>
    </div>
    <div class="score"><span id="starCount">0</span> ⭐</div>
  </header>
  
  <div class="progress" id="progress"></div>
  <main id="stage"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   SONS
   ================================================================ */
const SOUNDS = {
  click:   'sounds/click.mp3',
  success: 'sounds/success.mp3',
  error:   'sounds/error.mp3',
  win:     'sounds/win.mp3'
};
function playSound(name){
  // Descomente para ativar:
  // const a = new Audio(SOUNDS[name]);
  // a.volume = 0.35;
  // a.play().catch(() => {});
}

/* ================================================================
   ESTADO
   ================================================================ */
const game = {
  level: 1,
  stars: 0,
  completed: new Set(),
  maxUnlocked: 1,
  picks: null
};

/* ================================================================
   UTILITÁRIOS
   ================================================================ */
const $ = id => document.getElementById(id);
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let toastTimer;
function toast(msg, type = 'ok'){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
}
function showModal({ emoji, title, text, button, onClick }){
  document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
  const back = el('div', 'modal-backdrop');
  back.innerHTML = `
    <div class="modal">
      <div class="modal-emoji">${emoji}</div>
      <h3>${title}</h3>
      <p>${text}</p>
      <button class="btn" id="modalBtn">${button}</button>
    </div>`;
  document.body.appendChild(back);
  back.querySelector('#modalBtn').onclick = () => { back.remove(); onClick && onClick(); };
}

/* ================================================================
   POOL DE PADRÕES
   ================================================================ */
// Padrão: { type, title, desc, data, options:[{v:[emojis], c:bool}], hint }

const POOL_EASY = [
  {
    type: 'seq',
    title: 'Frutas Alternadas',
    desc: 'Qual fruta completa a sequência?',
    data: ['🍎','🍌','🍎','🍌','🍎','?'],
    options: [
      { v: ['🍎'], c: false },
      { v: ['🍌'], c: true },
      { v: ['🍇'], c: false },
      { v: ['🍊'], c: false }
    ],
    hint: 'As frutas se alternam: maçã, banana, maçã, banana...'
  },
  {
    type: 'seq',
    title: 'Sol e Lua',
    desc: 'O que vem depois da lua?',
    data: ['🌞','🌙','🌞','🌙','🌞','?'],
    options: [
      { v: ['🌞'], c: false },
      { v: ['🌙'], c: true },
      { v: ['⭐'], c: false },
      { v: ['☁️'], c: false }
    ],
    hint: 'Sol, lua, sol, lua, sol... qual é o próximo?'
  },
  {
    type: 'seq',
    title: 'Jardim Florido',
    desc: 'Qual flor completa a sequência?',
    data: ['🌸','🌻','🌸','🌻','🌸','?'],
    options: [
      { v: ['🌸'], c: false },
      { v: ['🌻'], c: true },
      { v: ['🌺'], c: false },
      { v: ['🌷'], c: false }
    ],
    hint: 'Duas flores se alternam: rosa, girassol, rosa, girassol...'
  },
  {
    type: 'seq',
    title: 'Pares de Cores',
    desc: 'As cores aparecem em pares. Qual completa?',
    data: ['🔴','🔴','🔵','🔵','🔴','🔴','?'],
    options: [
      { v: ['🔴'], c: false },
      { v: ['🔵'], c: true },
      { v: ['🟢'], c: false },
      { v: ['🟡'], c: false }
    ],
    hint: 'Dois vermelhos, dois azuis, dois vermelhos... então vêm dois azuis.'
  },
  {
    type: 'seq',
    title: 'Duplas de Frutas',
    desc: 'As frutas se repetem aos pares. Qual completa?',
    data: ['🍓','🍓','🍇','🍇','🍓','🍓','?'],
    options: [
      { v: ['🍓'], c: false },
      { v: ['🍇'], c: true },
      { v: ['🍒'], c: false },
      { v: ['🍑'], c: false }
    ],
    hint: 'Duas morangos, duas uvas, dois morangos... o próximo é uva.'
  },
  {
    type: 'seq',
    title: 'Cachorro e Gato',
    desc: 'Um cachorro, dois gatos... qual vem depois?',
    data: ['🐶','🐱','🐱','🐶','🐱','🐱','?'],
    options: [
      { v: ['🐶'], c: true },
      { v: ['🐱'], c: false },
      { v: ['🐭'], c: false },
      { v: ['🐹'], c: false }
    ],
    hint: 'O grupo que se repete é: 1 cachorro, 2 gatos.'
  },
  {
    type: 'seq',
    title: 'Triângulos e Círculos',
    desc: 'Dois triângulos, um círculo... qual vem depois?',
    data: ['🔺','🔺','🔵','🔺','🔺','🔵','?'],
    options: [
      { v: ['🔺'], c: true },

/* ================================================================
   SELEÇÃO ALEATÓRIA
   ================================================================ */
function pickNewPhases(){
  game.picks = {
    easy:   shuffle(POOL_EASY).slice(0, 3),
    medium: shuffle(POOL_MEDIUM).slice(0, 3),
    hard:   shuffle(POOL_HARD).slice(0, 3),
    final:  shuffle(POOL_FINAL).slice(0, 1)
  };
}
function getPhase(levelIndex){
  if (levelIndex < 3)  return game.picks.easy[levelIndex];
  if (levelIndex < 6)  return game.picks.medium[levelIndex - 3];
  if (levelIndex < 9)  return game.picks.hard[levelIndex - 6];
  return game.picks.final[0];
}
function getDiffInfo(levelIndex){
  if (levelIndex < 3)  return { emoji: '🌱', name: 'Fácil',   cls: 'easy'   };
  if (levelIndex < 6)  return { emoji: '🌿', name: 'Médio',   cls: 'medium' };
  if (levelIndex < 9)  return { emoji: '🌳', name: 'Difícil', cls: 'hard'   };
  return { emoji: '👑', name: 'Guardião', cls: 'final'  };
}

/* ================================================================
   HUD
   ================================================================ */
function updateHUD(){
  $('starCount').textContent = game.stars;
  const prog = $('progress');
  prog.innerHTML = '';
  for (let i = 1; i <= 10; i++){
    const d = el('button', 'dot', i);
    if (game.completed.has(i)) d.classList.add('done');
    if (i === game.level) d.classList.add('current');
    if (i > game.maxUnlocked) d.classList.add('locked');
    d.onclick = () => { if (i <= game.maxUnlocked) goToLevel(i); };
    prog.appendChild(d);
  }
}

/* ================================================================
   NAVEGAÇÃO
   ================================================================ */
function goToLevel(n){
  game.level = n;
  if (n > game.maxUnlocked) game.maxUnlocked = n;
  updateHUD();
  renderPhase(n - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function completeLevel(msg){
  const lvl = game.level;
  if (!game.completed.has(lvl)){
    game.completed.add(lvl);
    game.stars++;
  }
  if (lvl < 10) game.maxUnlocked = Math.max(game.maxUnlocked, lvl + 1);
  updateHUD();

  if (lvl === 10){
    showModal({
      emoji: '🏆',
      title: 'Você conseguiu!',
      text: 'Completou os 10 desafios e virou um Guardião da Floresta! 🎉',
      button: 'Nova aventura 🌱',
      onClick: () => {
        game.stars = 0;
        game.completed.clear();
        game.maxUnlocked = 1;
        pickNewPhases();
        goToLevel(1);
      }
    });
  } else {
    showModal({
      emoji: '🎉',
      title: 'Muito bem!',
      text: msg || 'Você descobriu o padrão!',
      button: 'Próxima fase ▶️',
      onClick: () => goToLevel(lvl + 1)
    });
  }
}

/* ================================================================
   RENDERIZAÇÃO
   ================================================================ */
function renderPhase(levelIndex){
  const phase = getPhase(levelIndex);
  const diff = getDiffInfo(levelIndex);
  const stage = $('stage');
  stage.innerHTML = '';

  const wrap = el('div', 'level');
  wrap.innerHTML = `
    <div class="level-head">
      <span class="badge ${diff.cls}">${diff.emoji} Fase ${levelIndex + 1} · ${diff.name}</span>
      <h2>${phase.title}</h2>
      <p>${phase.desc}</p>
    </div>
    <div class="pattern-area" id="patternArea"></div>
    <div class="options" id="optionsArea"></div>
    <div class="hint">💡 ${phase.hint}</div>
  `;
  stage.appendChild(wrap);

  const patternArea = wrap.querySelector('#patternArea');
  const optionsArea = wrap.querySelector('#optionsArea');

  let onCorrectTarget; // callback que substitui o "?"

  if (phase.type === 'seq')       onCorrectTarget = renderSeq(phase, patternArea, optionsArea);
  else if (phase.type === 'group') onCorrectTarget = renderGroup(phase, patternArea, optionsArea);
  else if (phase.type === 'grid')  onCorrectTarget = renderGrid(phase, patternArea, optionsArea);

  renderOptions(phase, optionsArea, onCorrectTarget);
}

/* ---------- Sequência ---------- */
function renderSeq(phase, patternArea, optionsArea){
  const seqBox = el('div', 'pattern-sequence');
  let unknownEl = null;
  phase.data.forEach(item => {
    const box = el('div', 'seq-item');
    if (item === '?'){
      box.classList.add('unknown');
      box.textContent = '?';
      unknownEl = box;
    } else {
      box.textContent = item;
    }
    seqBox.appendChild(box);
  });
  patternArea.appendChild(seqBox);

  return (opt) => {
    if (!unknownEl) return;
    unknownEl.classList.remove('unknown');
    unknownEl.classList.add('filled');
    unknownEl.innerHTML = '';
    opt.v.forEach(e => unknownEl.appendChild(el('span', '', e)));
  };
}

/* ---------- Grupo ---------- */
function renderGroup(phase, patternArea, optionsArea){
  const seqBox = el('div', 'pattern-sequence');
  phase.data.forEach(group => {
    const g = el('div', 'group-item');
    group.forEach(e => g.appendChild(el('span', '', e)));
    seqBox.appendChild(g);
  });
  const qbox = el('div', 'group-item unknown', '?');
  seqBox.appendChild(qbox);
  patternArea.appendChild(seqBox);

  return (opt) => {
    qbox.classList.remove('unknown');
    qbox.classList.add('filled');
    qbox.innerHTML = '';
    opt.v.forEach(e => qbox.appendChild(el('span', '', e)));
  };
}

/* ---------- Grade ---------- */
function renderGrid(phase, patternArea, optionsArea){
  const rows = phase.data.length;
  const cols = phase.data[0].length;
  const gridBox = el('div', 'pattern-grid');
  gridBox.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  let unknownEl = null;
  phase.data.forEach(row => {
    row.forEach(cell => {
      const c = el('div', 'grid-cell');
      if (cell === '?'){
        c.classList.add('unknown');
        c.textContent = '?';
        unknownEl = c;
      } else {
        c.textContent = cell;
      }
      gridBox.appendChild(c);
    });
  });
  patternArea.appendChild(gridBox);

  return (opt) => {
    if (!unknownEl) return;
    unknownEl.classList.remove('unknown');
    unknownEl.classList.add('filled');
    unknownEl.innerHTML = '';
    opt.v.forEach(e => unknownEl.appendChild(el('span', '', e)));
  };
}

/* ---------- Opções ---------- */
function renderOptions(phase, optionsArea, onCorrect){
  const shuffled = shuffle(phase.options);
  shuffled.forEach(opt => {
    const btn = el('button', 'option-btn');
    if (opt.v.length === 1){
      btn.textContent = opt.v[0];
    } else {
      const g = el('div', 'option-group');
      opt.v.forEach(e => g.appendChild(el('span', '', e)));
      btn.appendChild(g);
    }
    btn.onclick = () => {
      if (btn.disabled) return;
      if (opt.c){
        btn.classList.add('correct');
        onCorrect && onCorrect(opt);
        optionsArea.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        playSound('success');
        setTimeout(() => completeLevel('Você descobriu o padrão! 🌟'), 850);
      } else {
        btn.classList.add('wrong');
        playSound('error');
        toast('Não é essa. Observe o padrão com atenção! 👀', 'warn');
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    };
    optionsArea.appendChild(btn);
  });
}

/* ================================================================
   INICIALIZAÇÃO
   ================================================================ */
pickNewPhases();
updateHUD();
goToLevel(1);
